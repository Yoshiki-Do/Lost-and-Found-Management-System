<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found Management</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <h1>Lost and Found Management System</h1>

    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/items">Items List</a>
    </nav>

    <h2>Dashboard</h2>

    <div class="dashboard-container">
        <div class="dashboard-card">
            <h3>Total Items</h3>
            <p id="total-items">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Registered Items</h3>
            <p id="registered-items">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Returned Items</h3>
            <p id="returned-items">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Disposed Items</h3>
            <p id="disposed-items">0</p>
        </div>
    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
