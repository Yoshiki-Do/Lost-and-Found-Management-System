
{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/dashboard.css">
{% endblock %}

{% block content %}
<h2>Dashboard</h2>

<div class="dashboard-container">
    <div class="dashboard-card" data-status="">
        <h3>Total Items</h3>
        <p id="total-items">0</p>
    </div>

    <div class="dashboard-card" data-status="REGISTERED">
        <h3>Registered Items</h3>
        <p id="registered-items">0</p>
    </div>

    <div class="dashboard-card" data-status="RETURNED">
        <h3>Returned Items</h3>
        <p id="returned-items">0</p>
    </div>

    <div class="dashboard-card" data-status="DISPOSED">
        <h3>Disposed Items</h3>
        <p id="disposed-items">0</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
