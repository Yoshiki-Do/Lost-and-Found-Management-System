
{% extends "base.html" %}

{% block title %}Register New Item{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/register.css">
{% endblock %}

{% block content %}

<h2>Register New Item</h2>

<form id="register-form" class="register-form">

    <div class="form-group">
        <label for="item-name">Item Name</label>
        <input type="text" id="item-name" name="item_name" maxlength="200" required>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" maxlength="200"></textarea>
    </div>

    <div class="form-group">
        <label for="found-location">Found Location</label>
        <input type="text" id="found-location" name="found_location" maxlength="200" required>
    </div>

    <div class="form-group">
        <label for="found-at">Found Date</label>
        <input type="datetime-local" id="found-at" name="found_at" required>
    </div>

    <div class="form-group">
        <label for="storage-month">Storage Month</label>
        <input type="month" id="storage-month" name="storage_month" required disabled>
    </div>

    <div class="form-group">
        <label for="storage-box">Storage Box</label>
        <input type="text" id="storage-box" name="storage_box" maxlength="50" required>
    </div>

    <button type="submit" class="register-button">Register Item</button>

</form>

{% endblock %}

{% block extra_js %}
<script src="/static/js/register.js"></script>
{% endblock %}
