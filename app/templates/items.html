
{% extends "base.html" %}

{% block title %}Items List{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/items.css">
{% endblock %}

{% block content %}

<h2>Items List</h2>

<!-- Search area -->
<div class="search-container">

    <!-- Search filters -->
    <div class="search-filters">

        <div class="search-row">
            <input type="number" id="search-lost-number"
                   placeholder="Lost Number" min="1" step="1">

            <input type="text" id="search-item-name"
                   placeholder="Item Name">

            <input type="text" id="search-found-location"
                   placeholder="Found Location">

            <select id="search-status">
                <option value="">All Statuses</option>
                <option value="REGISTERED">Registered</option>
                <option value="RETURNED">Returned</option>
                <option value="DISPOSED">Disposed</option>
            </select>
        </div>

        <div class="search-row">
            <div class="date-filter">
                <label for="search-date-from">Found Date From</label>
                <input type="date" id="search-date-from">
            </div>

            <div class="date-filter">
                <label for="search-date-to">Found Date To</label>
                <input type="date" id="search-date-to">
            </div>
        </div>

    </div>

    <!-- Action buttons -->
    <div class="search-actions">
        <button id="search-button">Search</button>
        <button id="reset-button">Reset</button>
        <button id="export-csv-button">Export CSV</button>
    </div>

</div>

<!-- Items table -->
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Lost Number</th>
                <th>Item Name</th>
                <th>Found Location</th>
                <th>Found Date</th>
                <th>Storage Box</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="items-table-body">
        </tbody>
    </table>
</div>

{% endblock %}

{% block extra_js %}
<script src="/static/js/items.js"></script>
{% endblock %}
