{% extends "base.html" %}

{% block title %}History{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/history.css">
{% endblock %}

{% block content %}

<h2>History</h2>

<div class="search-container">

    <!-- Search filters -->
    <div class="search-filters">

        <div class="search-row">
            <input type="number" id="search-lost-number"
                   placeholder="Lost Number" min="1" step="1">

            <select id="search-action">
                <option value="">All Actions</option>
                <option value="REGISTERED">Registered</option>
                <option value="UPDATED">Updated</option>
                <option value="RETURNED">Returned</option>
                <option value="DISPOSED">Disposed</option>
            </select>
        </div>

        <div class="search-row">
            <div class="date-filter">
                <label for="search-date-from">History Date From</label>
                <input type="date" id="search-date-from">
            </div>

            <div class="date-filter">
                <label for="search-date-to">History Date To</label>
                <input type="date" id="search-date-to">
            </div>
        </div>

    </div>

    <!-- Action buttons -->
    <div class="search-actions">
        <button id="search-button">Search</button>
        <button id="reset-button">Reset</button>
    </div>

</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Lost Number</th>
                <th>Action</th>
                <th>Description</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody id="history-table-body"></tbody>
    </table>
</div>

{% endblock %}

{% block extra_js %}
<script src="/static/js/history.js"></script>
{% endblock %}
